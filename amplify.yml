# AWS Amplify Hosting build for this Next.js app (SSR).
# Node 20 is required by Next.js 16; Amplify's default image may be older,
# so it is pinned here rather than in the console.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20
        - nvm use 20
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
